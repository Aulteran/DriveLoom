<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b5cff">
  <meta name="referrer" content="no-referrer">
  <title>DriveLoom</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/"><img src="/icon.svg" alt="" width="28" height="28"><span>DriveLoom</span></a>
    <nav aria-label="Main">
      <a href="#/" data-nav="vehicles">Vehicles</a>
      <a href="#/friends" data-nav="friends">Friends</a>
      <a href="#/settings" data-nav="settings">Settings</a>
      <a href="#/admin" data-nav="admin" hidden id="nav-admin">Admin</a>
    </nav>
    <button type="button" class="ghost" id="signout">Sign out</button>
  </header>
  <main id="main" tabindex="-1"><p class="loading" role="status">Loading…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="panel">DriveLoom needs JavaScript enabled.</p></noscript>
</body>
</html>
