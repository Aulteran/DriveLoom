openapi: 3.1.0
info:
  title: DriveLoom API
  version: 0.1.0
  summary: Versioned contract skeleton for the self-hosted DriveLoom API.
  description: >
    Skeleton for milestone 1.1. Only instance-level endpoints exist. Accounts,
    vehicles, fuel and sharing endpoints are added by later milestones under the
    compatibility policy in docs/CONTRACTS.md.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same origin as the web client; the operator's proxy provides TLS.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database readiness
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      operationId: getVersion
      summary: Server, API and schema versions for client compatibility checks
      security: []
      responses:
        '200':
          description: Version information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
        default:
          $ref: '#/components/responses/Problem'
  # --- vehicles and ownership (milestone 1.3) ---
  /v1/vehicles:
    get:
      operationId: listVehicles
      summary: Vehicles the caller is a member of
      tags: [vehicles]
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Vehicles with the caller's role on each.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createVehicle
      summary: Create a vehicle; the caller becomes its owner
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getVehicle
      summary: Read a vehicle (any member). Non-members receive 404.
      tags: [vehicles]
      responses:
        '200':
          description: The vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateVehicle
      summary: Edit vehicle details (owner or editor)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiclePatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/archive:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    put:
      operationId: setVehicleArchived
      summary: Archive or unarchive a vehicle (owner only)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              additionalProperties: false
              properties:
                archived: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/members:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: listVehicleMembers
      summary: Members and roles (any member)
      tags: [vehicles]
      responses:
        '200':
          description: Roster.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VehicleMember' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addVehicleMember
      summary: Grant an active user access (owner only)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              additionalProperties: false
              properties:
                userId: { $ref: '#/components/schemas/Id' }
                role: { $ref: '#/components/schemas/GrantableRole' }
      responses:
        '201':
          description: Granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleMember' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/members/{userId}:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
        - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    put:
      operationId: changeVehicleMemberRole
      summary: Change a non-owner member's role (owner only)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/GrantableRole' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleMember' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeVehicleMember
      summary: Remove a member (owner), or leave (any non-owner member removing themselves)
      tags: [vehicles]
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/owner:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    put:
      operationId: transferVehicleOwnership
      summary: Transfer ownership to an existing member (owner only); the previous owner becomes an editor
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              additionalProperties: false
              properties:
                userId: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Transferred.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/vehicles/{vehicleId}/owner:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    put:
      operationId: recoverVehicleOwnership
      summary: Instance-admin recovery of ownership. Audited; grants no access to vehicle data.
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, reason]
              additionalProperties: false
              properties:
                userId: { $ref: '#/components/schemas/Id' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '204': { description: Ownership recovered. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: dl_session
      description: Placeholder; authentication is defined in milestone 1.2.
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
  responses:
    Problem:
      description: Error in RFC 9457 problem details form.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id:
      type: string
      format: uuid
      description: Opaque UUIDv7 identifier generated by the server.
      examples: ['018f3b1e-7c4a-7d2e-9a10-5b6c7d8e9f01']
    Timestamp:
      type: string
      format: date-time
      description: UTC instant in RFC 3339 form.
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: >
        Exact decimal as a string. Never a JSON number. Scale rules per field
        are in docs/CONTRACTS.md.
      examples: ['42.375']
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 alphabetic code.
    DistanceUnit:
      type: string
      enum: [km, mi]
    VolumeUnit:
      type: string
      enum: [l, gal_us, gal_imp]
    Role:
      type: string
      enum: [owner, editor, viewer]
    GrantableRole:
      type: string
      enum: [editor, viewer]
    VehicleInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        make: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        model: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        year: { type: [integer, 'null'], minimum: 1886 }
    VehiclePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        make: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        model: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        year: { type: [integer, 'null'], minimum: 1886 }
    Vehicle:
      type: object
      required: [id, name, make, model, year, archived, role, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        archived: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    VehicleMember:
      type: object
      required: [userId, role, grantedBy, createdAt]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/Role' }
        grantedBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }
    VersionInfo:
      type: object
      required: [server, api, schema]
      properties:
        server: { type: string, description: Server release version. }
        api: { type: string, description: API contract version (info.version). }
        schema: { type: integer, description: Latest applied database migration. }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: Stable error identifier URI or `about:blank`. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Machine-readable error code. }
