        '200':
          description: Preferences (instance defaults for fields never set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setPreferences
      summary: Change display preferences; stored records are never converted
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesPatch' }
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/fill-ups:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: listFillUps
      summary: Fuel purchases, newest first, with the interval each full fill closes
      tags: [fuel]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Fill-ups in the viewer's display units; entered values are returned unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FillUp' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createFillUp
      summary: Record a purchase (owner, editor or driver)
      description: >
        Units are chosen explicitly. The odometer may not run backwards in time
        (`odometer_out_of_sequence`), the same instant and reading is a
        duplicate (`duplicate_fill_up`), and a purchase in another currency
        needs `exchangeRate` or `reportingAmount` (`reporting_amount_required`).
      tags: [fuel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FillUpInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FillUp' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/fill-ups/{fillUpId}:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
      - { name: fillUpId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: getFillUp
      summary: One purchase
      tags: [fuel]
      responses:
        '200':
          description: The fill-up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FillUp' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateFillUp
      summary: Correct a purchase (owner or editor; a driver only their own); the merged record is validated again as a whole
      tags: [fuel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FillUpPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FillUp' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteFillUp
      summary: Delete a purchase (owner or editor; a driver only their own)
      tags: [fuel]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/service-visits:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: listServiceVisits
      summary: Service visits, newest first (service date, then record creation)
      description: >
        Every service endpoint answers 404 `module_disabled` while the Service
        module is off on this instance, and 404 to non-members. Any member may read.
        Page with `cursor` (the `nextCursor` of the previous page).
      tags: [service]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: from, in: query, description: 'Service date, inclusive.', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Service date, inclusive.', schema: { type: string, format: date } }
        - { name: q, in: query, description: 'Case-insensitive text search over provider, notes and item names and notes.', schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, description: 'Visits having at least one item of this category.', schema: { $ref: '#/components/schemas/ServiceCategory' } }
      responses:
        '200':
          description: A page of visits.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ServiceVisit' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createServiceVisit
      summary: Record a service visit (owner, editor or driver)
      description: >
        At least one item is required. `totalCost` and item `cost` are optional:
        omitted or null means unknown, "0" means known to be free. The odometer
        is optional, is never compared with fuel records and never changes them.
        Costs are in the vehicle's currency.
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceVisitInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVisit' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/service-visits/{visitId}:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
      - { name: visitId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: getServiceVisit
      summary: One service visit
      tags: [service]
      responses:
        '200':
          description: The visit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVisit' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateServiceVisit
      summary: Correct a visit (owner or editor; a driver only their own); the merged record is validated again as a whole
      description: When `items` is sent it replaces the whole item list.
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceVisitPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVisit' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteServiceVisit
      summary: Delete a visit and its items (owner or editor; a driver only their own)
      tags: [service]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/service-visits/{visitId}/attachments:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
      - { name: visitId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      operationId: addServiceAttachment
      summary: Attach a receipt or invoice to a visit (owner or editor; a driver only on their own visits)
      description: >
        The request body is the raw file (no multipart). Limits: 10 MiB per file (413 when exceeded), 10 files per visit (422 `attachment_limit`),
        PDF, JPEG or PNG only. The type is decided from the file's leading bytes (`%PDF-`, `FF D8 FF`, PNG signature); a file that is
        none of these, or whose declared Content-Type disagrees with its bytes, is refused with 422. The Content-Type may also be
        `application/octet-stream`. The display name comes from the `fileName` query parameter; it is reduced to a base name without
        control characters and limited to 200 characters. Stored in the database, so backups and exports include it. Works while the
        service module is on; when off every attachment route answers 404 `module_disabled`.
      tags: [service]
      parameters:
        - { name: fileName, in: query, required: false, description: Display name. Defaults to attachment with the detected extension, schema: { type: string, maxLength: 1000 } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAttachment' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/service-visits/{visitId}/attachments/{attachmentId}:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
      - { name: visitId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      - { name: attachmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: getServiceAttachment
      summary: Download one attachment (any member)
      description: >
        Sent with `content-disposition: attachment` (RFC 6266 `filename*`), `x-content-type-options: nosniff` and
        `cache-control: private, no-store`. With `inline=1` the disposition is `inline` so images and PDFs can be previewed; the
        response always carries `content-security-policy: default-src 'none'; sandbox`.
      tags: [service]
      parameters:
        - { name: inline, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: File bytes.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: renameServiceAttachment
      summary: Rename an attachment (same permissions as uploading)
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              additionalProperties: false
              properties:
                fileName: { type: string }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAttachment' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteServiceAttachment
      summary: Remove an attachment (same permissions as uploading)
      tags: [service]
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/stats:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getVehicleStats
      summary: Aggregate economy and spending for a window
      description: Intervals belong to the window their closing fill falls in. Economy is computed from summed distance and volume.
      tags: [fuel]
      parameters:
        - { name: from, in: query, description: Inclusive start, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: to, in: query, description: Exclusive end, schema: { $ref: '#/components/schemas/Timestamp' } }
      responses:
        '200':
          description: Statistics in the viewer's units and the vehicle's reporting currency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleStats' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  # --- friends and aggregate comparison (milestone 1.5) ---
  /v1/friends:
    get:
      operationId: listFriends
      summary: Accepted friends and pending requests in both directions
      tags: [friends]
      responses:
        '200':
          description: Relationships of the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendList' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: requestFriend
      summary: Ask a user of this instance by email; asking back accepts
      tags: [friends]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Current state of the relationship.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, accepted] }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/friends/{friendshipId}:
    parameters:
      - { name: friendshipId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    put:
      operationId: acceptFriend
