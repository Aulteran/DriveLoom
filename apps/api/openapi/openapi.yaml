  /v1/vehicles/{vehicleId}/export:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: exportVehicle
      summary: Download the vehicle's purchases as CSV or as a versioned JSON document
      description: Contains no ids, members or users. The JSON document also carries the vehicle's maintenance tasks (`maintenanceTasks`, with only vehicle-wide snoozes; personal snoozes are never exported) and service visits (`serviceVisits`, whose items point at tasks with `taskRef`) even while the Service module is off, each with its `attachments` embedded as base64 (`fileName`, `contentType`, `sha256`, `data`); a vehicle with many receipts therefore produces a large file (up to 10 files of 10 MiB per visit, about 4/3 of the stored size). CSV carries purchases only. Text cells that a spreadsheet could read as a formula are prefixed with an apostrophe.
      tags: [portability]
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, json] } }
      responses:
        '200':
          description: The export, as an attachment.
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { $ref: '#/components/schemas/VehicleExport' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/import:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    post:
      operationId: importIntoVehicle
      summary: Preview or commit an import of purchases (editor or owner)
      description: >
        `dryRun` defaults to true: the same statements run and are rolled back.
        A commit is all-or-nothing (`import_invalid` with the report when any
        row fails). Purchases that already exist are skipped, so importing the
        same file twice changes nothing. JSON imports accept bodies up to 96 MiB so that embedded
        service attachments fit; each attachment is checked by magic bytes, `sha256` (when given),
        size and the per-visit file limit, and identical files within a visit are stored once.
      tags: [portability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, data]
              additionalProperties: false
              properties:
                format: { type: string, enum: [csv, json] }
                data: { description: CSV text, or a VehicleExport document. }
                dryRun: { type: boolean, default: true }
      responses:
        '200':
          description: Report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicle-imports:
    post:
      operationId: importNewVehicle
      summary: Create a vehicle owned by the caller from a JSON export
      tags: [portability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              additionalProperties: false
              properties:
                data: { $ref: '#/components/schemas/VehicleExport' }
                dryRun: { type: boolean, default: true }
      responses:
        '200':
          description: Report; includes the new vehicle when committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
