        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setVehicleImage
      summary: Upload or replace the image (editor or owner). JPEG, PNG or WebP up to 5 MiB; the type is taken from the content
      tags: [vehicles]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
