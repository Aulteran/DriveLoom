                  items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: dl_session
      description: >
        HttpOnly, SameSite=Lax session cookie issued by sign-in. A session in
        state `mfa_required` is accepted only by `/v1/auth/mfa/totp` and `/v1/auth/mfa/email`.
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
  responses:
    Problem:
      description: 'Error in RFC 9457 problem details form.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id:
      type: string
      format: uuid
      description: 'Opaque UUIDv7 identifier generated by the server.'
      examples: ['018f3b1e-7c4a-7d2e-9a10-5b6c7d8e9f01']
    Timestamp:
      type: string
      format: date-time
      description: 'UTC instant in RFC 3339 form.'
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: >
        Exact decimal as a string. Never a JSON number. Scale rules per field
        are given per field in this document.
      examples: ['42.375']
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: 'ISO 4217 alphabetic code.'
    DistanceUnit:
      type: string
      enum: [km, mi]
    VolumeUnit:
      type: string
      enum: [l, gal_us, gal_imp]
    Role:
      type: string
      description: >
        The caller's or a member's role on a vehicle. `editor` is presented as
        "Authorized Manager": edits details, photo, imports and every fill-up.
        `driver` reads everything and adds fill-ups and service visits, changing or deleting only
        the ones they recorded. `viewer` only reads. Only the `owner` manages
        members, transfers ownership, archives and opts into comparisons.
      enum: [owner, editor, driver, viewer]
    GrantableRole:
      type: string
      description: Roles the owner can grant. `owner` moves only through ownership transfer.
      enum: [editor, driver, viewer]
    VehicleInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 80, description: Optional nickname. When absent, clients identify the vehicle by plate, year and model. }
        plateRegion: { type: [string, 'null'], maxLength: 10, description: "State or province code such as ON or FL. Private to the vehicle's members." }
        plateNumber: { type: [string, 'null'], maxLength: 12, description: Licence plate. Private to the vehicle's members. }
        vin: { type: [string, 'null'], minLength: 5, maxLength: 17, description: Vehicle identification number. Private to the vehicle's members. }
        make: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        model: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        year: { type: [integer, 'null'], minimum: 1886 }
        odometerUnit: { $ref: '#/components/schemas/DistanceUnit', description: Unit of the physical odometer. Defaults to the creator's distance preference. }
        currency: { $ref: '#/components/schemas/CurrencyCode', description: Reporting currency. Defaults to the creator's currency preference; locked once costs are recorded. }
    VehiclePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 80, description: Optional nickname; null clears it. }
        plateRegion: { type: [string, 'null'], maxLength: 10, description: "State or province code such as ON or FL. Private to the vehicle's members." }
        plateNumber: { type: [string, 'null'], maxLength: 12, description: Licence plate. Private to the vehicle's members. }
        vin: { type: [string, 'null'], minLength: 5, maxLength: 17, description: Vehicle identification number. Private to the vehicle's members. }
        make: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        model: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        year: { type: [integer, 'null'], minimum: 1886 }
        odometerUnit: { $ref: '#/components/schemas/DistanceUnit', description: Unit of the physical odometer. Defaults to the creator's distance preference. }
        currency: { $ref: '#/components/schemas/CurrencyCode', description: Reporting currency. Defaults to the creator's currency preference; locked once costs are recorded. }
    Vehicle:
      type: object
      required: [id, name, make, model, year, plateRegion, plateNumber, vin, archived, odometerUnit, currency, role, createdAt, updatedAt]
      properties:
        plateRegion: { type: [string, 'null'], maxLength: 10, description: "State or province code such as ON or FL. Private to the vehicle's members." }
        plateNumber: { type: [string, 'null'], maxLength: 12, description: Licence plate. Private to the vehicle's members. }
        vin: { type: [string, 'null'], minLength: 5, maxLength: 17, description: Vehicle identification number. Private to the vehicle's members. }
        odometerUnit: { $ref: '#/components/schemas/DistanceUnit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        imageVersion: { type: [string, 'null'], description: Opaque value that changes when the image changes; null when there is none. }
        id: { $ref: '#/components/schemas/Id' }
        name: { type: [string, 'null'] }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        archived: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    VehicleMember:
      type: object
      required: [userId, role, grantedBy, createdAt]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/Role' }
        grantedBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        displayName: { type: string }
        email: { type: string, format: email }
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 256 }
        display_name: { type: string, maxLength: 80 }
        setup_token: { type: string, maxLength: 256, description: 'Required for the first account when the operator set DRIVELOOM_SETUP_TOKEN.' }
        invite_token: { type: string, maxLength: 256, description: 'Admits one registration while registration is closed.' }
        units:
          $ref: '#/components/schemas/UnitChoice'
          description: 'For the first account, the instance default units; for anyone else, their own display preferences (omitted fields follow the instance defaults).'
    RegisterResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [created, verification_sent] }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }
    SessionState:
      type: object
      required: [state, csrf_token]
      properties:
        state: { type: string, enum: [signed_in, mfa_required] }
        csrf_token: { type: string, description: Send as X-CSRF-Token on unsafe requests. }
        mfa_method: { type: string, enum: [totp, email], description: 'With `mfa_required`: which second step completes the sign-in.' }
    TotpLoginRequest:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        recovery_code: { type: string }
    ReauthRequest:
      type: object
      additionalProperties: false
      properties:
        password: { type: string }
        code: { type: string }
    Modules:
      type: object
      description: 'Opt-in feature modules and whether the instance administrator has enabled each. All are off by default.'
      required: [service]
      additionalProperties: false
      properties:
        service: { type: boolean }
    ModulesResponse:
      type: object
      required: [modules]
      properties:
        modules: { $ref: '#/components/schemas/Modules' }
    NotificationSettings:
      type: object
      required: [emailEnabled, followUpDays, leadDays, leadDistance, smtpConfigured, canManage, me, recipients, delivery]
      properties:
        emailEnabled: { type: boolean, description: Off by default. }
        followUpDays: { type: integer, minimum: 0, maximum: 90, description: 'Days between repeat reminders while a task stays due or overdue; 0 = no repeats. Default 7.' }
        leadDays: { type: integer, description: '"Due soon" lead in days (the same illustrative default as the in-app status).' }
        leadDistance: { $ref: '#/components/schemas/Distance' }
        smtpConfigured: { type: boolean, description: Whether the administrator configured email. Without it nothing is sent and in-app reminders keep working. }
        canManage: { type: boolean, description: The caller is the owner or a manager. }
        me:
          type: object
          required: [eligible, selected, optedOut, receiving]
          properties:
            eligible: { type: boolean, description: 'The caller''s role can receive emails (owner, editor, driver).' }
            selected: { type: boolean, description: Always true for the owner. }
            optedOut: { type: boolean }
            receiving: { type: boolean, description: '`emailEnabled && eligible && selected && !optedOut` (emails still need SMTP).' }
        recipients:
          description: Owner and managers only; null for other members. Members whose role can receive emails.
          oneOf:
            - type: array
              items:
                type: object
                required: [userId, displayName, email, role, selected, optedOut, implicit]
                properties:
                  userId: { $ref: '#/components/schemas/Id' }
                  displayName: { type: string }
                  email: { type: string }
                  role: { type: string, enum: [owner, editor, driver] }
                  selected: { type: boolean }
                  optedOut: { type: boolean }
                  implicit: { type: boolean, description: The owner, who receives emails without being selected. }
            - { type: 'null' }
        delivery:
          description: Owner and managers only; null for other members. Counts only, no addresses or error text.
          oneOf:
            - type: object
              required: [lastSentAt, pending, failed]
              properties:
                lastSentAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
                pending: { type: integer }
                failed: { type: integer }
            - { type: 'null' }
    NotificationSettingsInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        emailEnabled: { type: boolean }
        followUpDays: { type: integer, minimum: 0, maximum: 90 }
        recipientUserIds: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
    ServiceVisibility:
      type: object
      description: 'Whether the caller sees this vehicle''s Service page. `visible` is `moduleEnabled && showService`: the server switch overrides the personal preference. Only menus are affected; permissions and stored data never change.'
      required: [showService, moduleEnabled, visible]
      properties:
        showService: { type: boolean, description: 'The caller''s own preference (true when never set).' }
        moduleEnabled: { type: boolean }
        visible: { type: boolean }
    AccountSession:
      type: object
      required: [csrf_token, session_id, account, modules]
      properties:
        csrf_token: { type: string }
        session_id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/Account' }
        modules: { $ref: '#/components/schemas/Modules' }
    Account:
      type: object
      required: [id, email, instanceRole, emailVerified, credentials]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string }
        displayName: { type: string }
        instanceRole: { type: string, enum: [admin, user] }
        emailVerified: { type: boolean }
        credentials: { type: object, description: Which sign-in methods are set up (password, totp, passkeys, oidc). }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
            required: [id, created_at, last_seen_at, current]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              created_at: { $ref: '#/components/schemas/Timestamp' }
              last_seen_at: { $ref: '#/components/schemas/Timestamp' }
              user_agent: { type: string }
              current: { type: boolean }
    RevokedCount:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer }
    SetPasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, description: Required when a password already exists. }
        new_password: { type: string, minLength: 12, maxLength: 256 }
    RecoveryRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
    RecoveryComplete:
      type: object
      required: [email, code, new_password]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 256 }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    TotpEnrolment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret, shown once. }
        otpauth_uri: { type: string }
    TotpConfirm:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, items: { type: string }, description: Single-use codes, shown once. }
    WebAuthnOptions:
      type: object
      description: 'JSON options as defined by the WebAuthn Level 3 JSON serialisation.'
    PasskeyRegisterVerify:
      type: object
      required: [response]
      properties:
        response: { type: object, description: RegistrationResponseJSON from the browser. }
        label: { type: string, maxLength: 60 }
    PasskeyLoginVerify:
      type: object
      required: [response]
      properties:
        response: { type: object, description: AuthenticationResponseJSON from the browser. }
    IdOnly:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Id' }
    OidcStart:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [login, link], default: login }
        setup_token: { type: string, maxLength: 256, description: 'Required when the first account is created through the identity provider and the operator set DRIVELOOM_SETUP_TOKEN.' }
        units:
          $ref: '#/components/schemas/UnitChoice'
          description: 'Applied as in registration, only if this sign-in creates an account.'
    OidcStartResult:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    OidcCallbackResult:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [signed_in, mfa_required] }
        csrf_token: { type: string }
        status: { type: string, enum: [linked] }
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }
    VersionInfo:
      type: object
      required: [server, api, schema]
      properties:
        server: { type: string, description: Server release version. }
        api: { type: string, description: API contract version (info.version). }
        schema: { type: integer, description: Latest applied database migration. }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: Stable error identifier URI or `about:blank`. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Machine-readable error code. }
    EconomyUnit:
      type: string
      enum: [l_per_100km, km_per_l, mpg_us, mpg_imp]
      description: '`mpg_us` uses the US gallon, `mpg_imp` the imperial gallon.'
    SmtpSettings:
      type: object
      required: [source, enabled, configured, host, port, security, username, from, hasPassword, secretUnreadable]
      properties:
        source: { type: string, enum: [env, database, none] }
        enabled: { type: boolean, description: 'The administrator switch. Off keeps the saved fields but the feature is not in use. Always true for `env`.' }
        configured: { type: boolean, description: 'The feature is actually in use: enabled, complete and readable.' }
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [tls, starttls, none] }
        username: { type: string }
        from: { type: string }
        hasPassword: { type: boolean }
        secretUnreadable: { type: boolean, description: 'A stored secret cannot be decrypted with this instance key (for example after a restore onto another key); enter it again.' }
    SmtpSettingsInput:
      type: object
      additionalProperties: false
      required: [host, port, security, from]
      properties:
        enabled: { type: boolean, description: 'Omit to keep the current state (on for a first save). Turning off is refused under the same guards as removal.' }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { type: string, enum: [tls, starttls, none] }
        username: { type: string, maxLength: 255 }
        password: { type: [string, 'null'], maxLength: 512, description: 'Omit to keep the stored password; null or empty removes it.' }
        from: { type: string, maxLength: 254 }
    SmtpTestResult:
      type: object
      required: [sentTo]
      properties: { sentTo: { type: string } }
    OidcSettings:
      type: object
      required: [source, enabled, configured, issuer, clientId, hasClientSecret, secretUnreadable, redirectUri]
      properties:
        source: { type: string, enum: [env, database, none] }
        enabled: { type: boolean, description: 'The administrator switch. Off keeps the saved fields but the feature is not in use. Always true for `env`.' }
        configured: { type: boolean, description: 'The feature is actually in use: enabled, complete and readable.' }
        issuer: { type: string }
        clientId: { type: string }
        hasClientSecret: { type: boolean }
        secretUnreadable: { type: boolean }
        redirectUri: { type: string, description: 'Register this redirect URI with the identity provider.' }
    OidcSettingsInput:
      type: object
      additionalProperties: false
      required: [issuer, clientId]
      properties:
        enabled: { type: boolean, description: 'Omit to keep the current state (on for a first save). Turning off is refused under the same guards as removal.' }
        issuer: { type: string, maxLength: 512, description: 'An https URL.' }
        clientId: { type: string, maxLength: 255 }
        clientSecret: { type: string, maxLength: 1024, description: 'Required the first time; omit to keep the stored secret.' }
    OidcTestResult:
      type: object
      required: [issuer, authorizationEndpoint]
      properties:
        issuer: { type: string }
        authorizationEndpoint: { type: [string, 'null'] }
    UnitSettings:
      type: object
      required: [distanceUnit, volumeUnit, economyUnit, currency]
      properties:
        distanceUnit: { $ref: '#/components/schemas/DistanceUnit' }
        volumeUnit: { $ref: '#/components/schemas/VolumeUnit' }
        economyUnit: { $ref: '#/components/schemas/EconomyUnit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    UnitChoice:
      type: object
      additionalProperties: false
      properties:
        distanceUnit: { $ref: '#/components/schemas/DistanceUnit' }
        volumeUnit: { $ref: '#/components/schemas/VolumeUnit' }
        economyUnit: { $ref: '#/components/schemas/EconomyUnit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    Preferences:
      description: 'Effective preferences: the caller''s own choices over the instance defaults.'
      allOf:
        - { $ref: '#/components/schemas/UnitSettings' }
        - type: object
          required: [instanceDefaults, inherited]
          properties:
            instanceDefaults: { $ref: '#/components/schemas/UnitSettings' }
            inherited:
              type: array
              description: Fields the caller has not chosen, which follow the instance defaults.
              items: { type: string, enum: [distanceUnit, volumeUnit, economyUnit, currency] }
    PreferencesPatch:
      type: object
      additionalProperties: false
      description: 'Only the listed fields change. null makes a field follow the instance default again.'
      properties:
        distanceUnit: { oneOf: [{ $ref: '#/components/schemas/DistanceUnit' }, { type: 'null' }] }
        volumeUnit: { oneOf: [{ $ref: '#/components/schemas/VolumeUnit' }, { type: 'null' }] }
        economyUnit: { oneOf: [{ $ref: '#/components/schemas/EconomyUnit' }, { type: 'null' }] }
        currency: { oneOf: [{ $ref: '#/components/schemas/CurrencyCode' }, { type: 'null' }] }
    Distance:
      type: object
      required: [value, unit]
      additionalProperties: false
      properties:
        value: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/DistanceUnit' }
    Volume:
      type: object
      required: [value, unit]
      additionalProperties: false
      properties:
        value: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/VolumeUnit' }
    Economy:
      type: object
      required: [value, unit]
      properties:
        value: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/EconomyUnit' }
    FillUpCostInput:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        exchangeRate: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: Reporting-currency units per one unit of `currency`. Only for a purchase in another currency. }
        reportingAmount: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: The amount in the vehicle's reporting currency. Wins over `exchangeRate` when both are sent. }
        reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
    FillUpCost:
      type: object
      required: [amount, currency, exchangeRate, reportingAmount, reportingCurrency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        exchangeRate: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        reportingAmount: { $ref: '#/components/schemas/Decimal' }
        reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
    FillUpInput:
      type: object
      required: [occurredAt, odometer, volume]
      additionalProperties: false
      properties:
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        odometer: { $ref: '#/components/schemas/Distance' }
        volume: { $ref: '#/components/schemas/Volume' }
        full: { type: boolean, default: true, description: The tank was filled completely. }
        missedPrevious: { type: boolean, default: false, description: One or more purchases before this one were not recorded. }
        cost: { oneOf: [{ $ref: '#/components/schemas/FillUpCostInput' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 500 }
    FillUpPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        odometer: { $ref: '#/components/schemas/Distance' }
        volume: { $ref: '#/components/schemas/Volume' }
        full: { type: boolean }
        missedPrevious: { type: boolean }
        cost: { oneOf: [{ $ref: '#/components/schemas/FillUpCostInput' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 500 }
    FillUpInterval:
      type: object
      required: [available, reason, distance, volume, economy]
      description: The full-to-full interval a purchase closes. Unavailable intervals carry a reason and no figures.
      properties:
        available: { type: boolean }
        reason: { type: [string, 'null'], enum: [partial_fill, no_previous_full_fill, missed_fill, no_distance, null] }
        distance: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        volume: { oneOf: [{ $ref: '#/components/schemas/Volume' }, { type: 'null' }] }
        economy: { oneOf: [{ $ref: '#/components/schemas/Economy' }, { type: 'null' }] }
    FillUp:
      type: object
      required: [id, vehicleId, occurredAt, odometer, volume, full, missedPrevious, cost, notes, createdBy, createdAt, updatedAt, display, interval]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        vehicleId: { $ref: '#/components/schemas/Id' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        odometer: { $ref: '#/components/schemas/Distance', description: Exactly as entered. }
        volume: { $ref: '#/components/schemas/Volume', description: Exactly as entered. }
        full: { type: boolean }
        missedPrevious: { type: boolean }
        cost: { oneOf: [{ $ref: '#/components/schemas/FillUpCost' }, { type: 'null' }] }
        notes: { type: string }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        display:
          type: object
          required: [odometer, volume]
          description: Converted values. Odometer in the vehicle's odometer unit, volume in the viewer's volume unit.
          properties:
            odometer: { $ref: '#/components/schemas/Distance' }
            volume: { $ref: '#/components/schemas/Volume' }
        interval: { oneOf: [{ $ref: '#/components/schemas/FillUpInterval' }, { type: 'null' }] }
    ServiceCategory:
      type: string
      enum: [scheduled, repair, inspection, other]
    ServiceItemInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Free text. Clients may offer presets such as "Oil change" but any text is accepted. }
        category: { $ref: '#/components/schemas/ServiceCategory', description: Defaults to `other`. }
        cost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: In the vehicle's currency. Null or absent is unknown; "0" is a known zero. }
        notes: { type: [string, 'null'], maxLength: 500 }
        taskId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: The maintenance task of this vehicle that this item completes. Chosen by a person; never inferred from the name. }
    ServiceItem:
      type: object
      required: [id, name, category, cost, notes, taskId]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        category: { $ref: '#/components/schemas/ServiceCategory' }
        cost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        notes: { type: [string, 'null'] }
        taskId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: The maintenance task this item completes; null when none, or when the task was deleted. }
    ServiceExportAttachment:
      type: object
      required: [fileName, data]
      additionalProperties: false
      properties:
        fileName: { type: string }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        data: { type: string, contentEncoding: base64 }
    ServiceVisitInput:
      type: object
      required: [servicedOn, items]
      additionalProperties: false
      properties:
        servicedOn: { type: string, format: date, description: The day the work was done. }
        odometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Optional; not required to fit between fuel readings. }
        provider: { type: [string, 'null'], maxLength: 120 }
        diy: { type: boolean, default: false, description: Done by the owner rather than a workshop. }
        totalCost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: Whole-visit cost in the vehicle's currency. Null or absent is unknown; "0" is a known zero. It is not checked against item costs. }
        notes: { type: [string, 'null'], maxLength: 2000 }
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/ServiceItemInput' } }
    ServiceVisitExport:
      type: object
      description: A ServiceVisitInput plus optional embedded attachments.
      required: [servicedOn, items]
      additionalProperties: false
      properties:
        servicedOn: { type: string, format: date, description: The day the work was done. }
        odometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Optional; not required to fit between fuel readings. }
        provider: { type: [string, 'null'], maxLength: 120 }
        diy: { type: boolean, default: false, description: Done by the owner rather than a workshop. }
        totalCost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: Whole-visit cost in the vehicle's currency. Null or absent is unknown; "0" is a known zero. It is not checked against item costs. }
        notes: { type: [string, 'null'], maxLength: 2000 }
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/ServiceItemExport' } }
        attachments: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ServiceExportAttachment' } }
    ServiceVisitPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        servicedOn: { type: string, format: date }
        odometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        provider: { type: [string, 'null'], maxLength: 120 }
        diy: { type: boolean }
        totalCost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/ServiceItemInput' } }
    ServiceAttachment:
      type: object
      description: A receipt or invoice file. The bytes are only available through the download endpoint.
      required: [id, fileName, contentType, sizeBytes, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fileName: { type: string, minLength: 1, maxLength: 200 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, maximum: 10485760 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    ServiceVisit:
      type: object
      required: [id, vehicleId, servicedOn, odometer, display, provider, diy, totalCost, currency, notes, items, attachments, createdBy, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        vehicleId: { $ref: '#/components/schemas/Id' }
        servicedOn: { type: string, format: date }
        odometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Exactly as entered. }
        display:
          type: object
          required: [odometer]
          properties:
            odometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Converted to the vehicle's odometer unit. }
        provider: { type: [string, 'null'] }
        diy: { type: boolean }
        totalCost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        notes: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/ServiceItem' } }
        attachments: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ServiceAttachment' } }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    MaintenanceDefaults:
      type: object
      description: Illustrative defaults for "due soon" and for a reading being too old to trust. Not manufacturer or safety guidance.
      required: [leadDays, leadDistance, staleReadingDays]
      properties:
        leadDays: { type: integer, description: A task due within this many days is `due_soon`. }
        leadDistance: { $ref: '#/components/schemas/Distance' }
        staleReadingDays: { type: integer, description: An odometer reading older than this is stale; a stale or missing reading never shows a distance as `ok`. }
    MaintenanceTaskState:
      type: string
      enum: [ok, due_soon, overdue, no_baseline, unknown_reading, completed]
      description: >
        `overdue` and `due_soon` come from the date, the odometer, or both (the worse wins). `no_baseline`: nothing
        to count from (no linked completion and no first-due point, or the last completion lacked the odometer a
        distance interval needs); nothing is assumed. `unknown_reading`: a distance is involved and there is no
        recent odometer reading to say it is ok. `completed`: a one-time task with a linked completion. A task is
        `ok` only when every dimension it has is known and not near.
    MaintenanceSnooze:
      type: object
      required: [scope, until, untilOdometer, reason, createdBy, createdAt]
      properties:
        scope: { type: string, enum: [personal, vehicle] }
        until: { oneOf: [{ type: string, format: date }, { type: 'null' }], description: Last day the snooze is active. }
        untilOdometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Absolute odometer target in the vehicle's unit; the snooze ends once the known odometer exceeds it. }
        reason: { type: [string, 'null'] }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    MaintenanceTaskInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Required unless `catalogKey` is given. }
        catalogKey: { oneOf: [{ type: string }, { type: 'null' }], description: A key from the catalog; a label only, it brings no interval. }
        recurring: { type: boolean, default: true }
        intervalDays: { oneOf: [{ type: integer, minimum: 1, maximum: 36500 }, { type: 'null' }] }
        intervalDistance: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Greater than zero. }
        firstDueOn: { oneOf: [{ type: string, format: date }, { type: 'null' }], description: Used until the task is first completed. }
        firstDueOdometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Used until the task is first completed. }
        notes: { type: [string, 'null'], maxLength: 500 }
    MaintenanceTaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        catalogKey: { oneOf: [{ type: string }, { type: 'null' }] }
        recurring: { type: boolean }
        intervalDays: { oneOf: [{ type: integer, minimum: 1, maximum: 36500 }, { type: 'null' }] }
        intervalDistance: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        firstDueOn: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        firstDueOdometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 500 }
        archived: { type: boolean, description: Hide the task without deleting it or its history. }
    MaintenanceSnoozeInput:
      type: object
      additionalProperties: false
      properties:
        until: { type: string, format: date, description: Today or later, at most 3650 days ahead. }
        untilOdometer: { $ref: '#/components/schemas/Distance' }
        additionalDistance: { $ref: '#/components/schemas/Distance' }
        reason: { type: [string, 'null'], maxLength: 200 }
    MaintenanceTask:
      type: object
      description: >
        A task and its status, computed on read (never stored). The next due point comes from the most recent
        service item linked to the task (that visit's date and, when recorded, odometer) plus the interval; without
        a linked completion, from `firstDueOn` / `firstDueOdometer`. Distance uses only the latest known odometer
        and never extrapolates. Dates are compared in UTC; due today is `due_soon`, past is `overdue`.
      required: [id, vehicleId, name, catalogKey, recurring, intervalDays, intervalDistance, firstDueOn, firstDueOdometer, notes, archived, createdBy, createdAt, updatedAt,
        status, dueOn, dueOdometer, daysUntilDue, distanceUntilDue, baseline, distanceBaselineMissing, readingStale, lastCompleted, snoozed, snoozes, reminderSuppressed, needsAttention]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        vehicleId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        catalogKey: { type: [string, 'null'] }
        recurring: { type: boolean }
        intervalDays: { type: [integer, 'null'] }
        intervalDistance: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Exactly as entered. }
        firstDueOn: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        firstDueOdometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: Exactly as entered. }
        notes: { type: [string, 'null'] }
        archived: { type: boolean }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/MaintenanceTaskState' }
        dueOn: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        dueOdometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: In the vehicle's odometer unit, rounded to whole units. }
        daysUntilDue: { type: [integer, 'null'], description: Negative when past. }
        distanceUntilDue: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }], description: From the latest known reading to `dueOdometer`; negative when past. Null without a reading. }
        baseline: { type: string, enum: [completion, first_due, none] }
        distanceBaselineMissing: { type: boolean, description: A distance interval exists but the last completion recorded no odometer. }
        readingStale: { type: boolean, description: The task has an odometer due point and the latest reading is missing or older than `staleReadingDays`. Time-only tasks are never stale. }
        lastCompleted:
          oneOf:
            - type: 'null'
            - type: object
              required: [visitId, servicedOn, odometer]
              properties:
                visitId: { $ref: '#/components/schemas/Id' }
                servicedOn: { type: string, format: date }
                odometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        snoozed: { oneOf: [{ $ref: '#/components/schemas/MaintenanceSnoozeView' }, { type: 'null' }], description: The active snooze that applies to the caller (personal first, else vehicle-wide). The status above is unchanged. }
        snoozes: { type: array, items: { $ref: '#/components/schemas/MaintenanceSnoozeView' }, description: All active snoozes that apply to the caller. }
        reminderSuppressed: { type: boolean, description: True while any snooze is active. Muting reminders does not make delaying safe. }
        needsAttention: { type: boolean, description: Status is `due_soon` or `overdue`. }
    MaintenanceSnoozeView:
      allOf: [{ $ref: '#/components/schemas/MaintenanceSnooze' }]
    MaintenanceSummary:
      type: object
      required: [counts, reading, defaults]
      properties:
        counts:
          type: object
          required: [total, overdue, due_soon, ok, no_baseline, unknown_reading, completed, snoozed, needsAttention, remindersActive]
          properties:
            total: { type: integer }
            overdue: { type: integer }
            due_soon: { type: integer }
            ok: { type: integer }
            no_baseline: { type: integer }
            unknown_reading: { type: integer }
            completed: { type: integer }
            snoozed: { type: integer, description: Tasks with an active snooze for the caller. }
            needsAttention: { type: integer, description: Overdue plus due soon, snoozed or not. }
            remindersActive: { type: integer, description: Needing attention and not snoozed. }
        reading:
          oneOf:
            - type: 'null'
            - type: object
              required: [odometer, on, source, stale]
              properties:
                odometer: { $ref: '#/components/schemas/Distance' }
                on: { type: string, format: date }
                source: { type: string, enum: [fuel, service] }
                stale: { type: boolean }
        defaults: { $ref: '#/components/schemas/MaintenanceDefaults' }
    MaintenanceTaskExport:
      type: object
      description: A task as exported; `ref` labels it for `taskRef` on service items. Vehicle-wide snooze only, and only while active; personal snoozes are never exported.
      required: [ref, name]
      additionalProperties: false
      properties:
        ref: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        catalogKey: { type: [string, 'null'] }
        recurring: { type: boolean, default: true }
        intervalDays: { type: [integer, 'null'] }
        intervalDistance: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        firstDueOn: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        firstDueOdometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 500 }
        archived: { type: boolean, default: false }
        snooze:
          type: object
          additionalProperties: false
          properties:
            until: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
            untilOdometer: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
            reason: { type: [string, 'null'], maxLength: 200 }
    ServiceItemExport:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: '#/components/schemas/ServiceCategory' }
        cost: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 500 }
        taskRef: { type: string, description: The `ref` of an entry of `maintenanceTasks` that this item completes. }
    VehicleStats:
      type: object
      required: [vehicleId, window, fillCount, intervalCount, unavailableIntervalCount, distance, volume, economy, spend, costPerDistance, series]
      properties:
        vehicleId: { $ref: '#/components/schemas/Id' }
        window:
          type: object
          required: [from, to]
          properties:
            from: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            to: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        fillCount: { type: integer }
        intervalCount: { type: integer, description: Available intervals in the window. }
        unavailableIntervalCount: { type: integer }
        distance: { $ref: '#/components/schemas/Distance' }
        volume: { $ref: '#/components/schemas/Volume' }
        economy: { oneOf: [{ $ref: '#/components/schemas/Economy' }, { type: 'null' }] }
        spend:
          type: object
          required: [amount, currency, costedFillCount]
          description: Sum of every costed purchase in the window, in the reporting currency. Not an efficiency figure.
          properties:
            amount: { $ref: '#/components/schemas/Decimal' }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            costedFillCount: { type: integer }
        costPerDistance:
          oneOf:
            - type: object
              required: [value, currency, per]
              properties:
                value: { $ref: '#/components/schemas/Decimal' }
                currency: { $ref: '#/components/schemas/CurrencyCode' }
                per: { $ref: '#/components/schemas/DistanceUnit' }
            - type: 'null'
        series:
          type: array
          description: Economy of each available interval, oldest first, for charts.
          items:
            type: object
            required: [at, economy]
            properties:
              at: { $ref: '#/components/schemas/Timestamp' }
              economy: { $ref: '#/components/schemas/Decimal' }
    FriendEntry:
      type: object
      required: [id, userId, displayName, email]
      properties:
        id: { $ref: '#/components/schemas/Id', description: Friendship id, used to accept or remove. }
        userId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        email: { type: string, format: email }
        since: { $ref: '#/components/schemas/Timestamp' }
        requestedAt: { $ref: '#/components/schemas/Timestamp' }
    FriendList:
      type: object
      required: [friends, incoming, outgoing]
      properties:
        friends: { type: array, items: { $ref: '#/components/schemas/FriendEntry' } }
        incoming: { type: array, items: { $ref: '#/components/schemas/FriendEntry' } }
        outgoing: { type: array, items: { $ref: '#/components/schemas/FriendEntry' } }
    ComparisonOptIn:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    ComparedVehicle:
      type: object
      required: [name, make, model, year, economy, costPerDistance, costUnavailableReason]
      properties:
        vehicleId: { $ref: '#/components/schemas/Id', description: Present only on the caller's own vehicles. }
        plateRegion: { type: [string, 'null'], description: Present only on the caller's own vehicles; never sent for a friend's. }
        plateNumber: { type: [string, 'null'], description: Present only on the caller's own vehicles; never sent for a friend's. }
        name: { type: [string, 'null'], description: Optional nickname. }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        economy: { oneOf: [{ $ref: '#/components/schemas/Economy' }, { type: 'null' }], description: Null when the window has no complete interval. }
        costPerDistance:
          oneOf:
            - type: object
              required: [value, currency, per]
              properties:
                value: { $ref: '#/components/schemas/Decimal' }
                currency: { $ref: '#/components/schemas/CurrencyCode' }
                per: { $ref: '#/components/schemas/DistanceUnit' }
            - type: 'null'
        costUnavailableReason: { type: [string, 'null'], enum: [currency_mismatch, no_cost_data, null] }
    Comparison:
      type: object
      required: [window, units, mine, friends]
      properties:
        window:
          type: object
          required: [key, from, to]
          properties:
            key: { type: string, enum: ['30d', '90d', '365d', all] }
            from: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            to: { $ref: '#/components/schemas/Timestamp' }
        units:
          type: object
          required: [economy, distance, currency]
          properties:
            economy: { $ref: '#/components/schemas/EconomyUnit' }
            distance: { $ref: '#/components/schemas/DistanceUnit' }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
        mine: { type: array, items: { $ref: '#/components/schemas/ComparedVehicle' } }
        friends:
          type: array
          items:
            type: object
            required: [userId, displayName, vehicles]
            properties:
              userId: { $ref: '#/components/schemas/Id' }
              displayName: { type: string }
              vehicles: { type: array, items: { $ref: '#/components/schemas/ComparedVehicle' } }
    VehicleExport:
      type: object
      required: [format, version, vehicle, fillUps]
      properties:
        format: { type: string, const: driveloom.vehicle }
        version: { type: integer, const: 1 }
        exportedAt: { $ref: '#/components/schemas/Timestamp' }
        vehicle:
          type: object
          properties:
            name: { type: [string, 'null'] }
            plateRegion: { type: string }
            plateNumber: { type: string }
            vin: { type: string }
            make: { type: [string, 'null'] }
            model: { type: [string, 'null'] }
            year: { type: [integer, 'null'] }
            odometerUnit: { $ref: '#/components/schemas/DistanceUnit' }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
        fillUps: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/FillUpInput' } }
        maintenanceTasks: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/MaintenanceTaskExport' }, description: Optional, added without a version bump; older files lack it. Always exported, and imported when present, regardless of the Service module switch. An identical task already on the vehicle is skipped and reused for `taskRef` links. }
        serviceVisits: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/ServiceVisitExport' }, description: Optional, added without a version bump; older files lack it. Always exported, and imported when present, regardless of the Service module switch. }
    ImportReport:
      type: object
      required: [dryRun, committed, summary, errors]
      properties:
        dryRun: { type: boolean }
        committed: { type: boolean }
        summary:
          type: object
          required: [total, created, duplicates, invalid]
          properties:
            total: { type: integer }
            created: { type: integer }
            duplicates: { type: integer }
            invalid: { type: integer }
        errors:
          type: array
          description: At most 100. `row` counts data rows from 1.
          items:
            type: object
            required: [row, code, message]
            properties:
              row: { type: integer }
              code: { type: string }
              message: { type: string }
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        serviceVisits:
          type: object
          description: Present when the JSON file carried `serviceVisits`; failures are also counted in `summary.invalid`.
          required: [total, created, duplicates, invalid]
          properties:
            total: { type: integer }
            created: { type: integer }
            duplicates: { type: integer }
            invalid: { type: integer }
        maintenanceTasks:
          type: object
          description: Present when the JSON file carried `maintenanceTasks`; failures are also counted in `summary.invalid`.
          required: [total, created, duplicates, invalid]
          properties:
            total: { type: integer }
            created: { type: integer }
            duplicates: { type: integer }
            invalid: { type: integer }
    AdminUser:
      type: object
      required: [id, email, displayName, instanceRole, status, createdAt, ownedVehicleCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        instanceRole: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, disabled] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        ownedVehicleCount: { type: integer }
    Invite:
      type: object
      required: [id, email, createdAt, expiresAt, usedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        usedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    AuditEvent:
      type: object
      required: [id, occurredAt, actorId, action, subjectType, subjectId, details]
      properties:
