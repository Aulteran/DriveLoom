openapi: 3.1.0
info:
  title: DriveLoom API
  version: 0.3.0
  summary: Versioned contract for the self-hosted DriveLoom API.
  description: >
    Contract for the self-hosted DriveLoom API under the compatibility policy
    in docs/CONTRACTS.md. Authenticated requests
    use the `dl_session` cookie; unsafe methods must also send the
    `X-CSRF-Token` returned at sign-in, and any `Origin` header must equal the
    instance public origin.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
security:
  - session: []
servers:
  - url: /
    description: Same origin as the web client; the operator's proxy provides TLS.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: 'Liveness and database readiness'
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      operationId: getVersion
      summary: 'Server, API and schema versions for client compatibility checks'
      security: []
      responses:
        '200':
          description: Version information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: 'Create an account'
      security: []
      description: 'The first account on an instance becomes its administrator; when the operator configured a setup token, that registration must present it (`setup_token_required`). Later registration follows the instance policy.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Accepted. With email verification the response is the same whether or not the address is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResult' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: 'Verify an email address with an emailed code'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 'Sign in with email and password'
      security: []
      description: 'Sets the session cookie. When a second factor is enrolled the result state is `mfa_required`. Unknown account and wrong password are indistinguishable.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionState' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/mfa/totp:
    post:
      operationId: completeTotp
      tags: [auth]
      summary: 'Complete sign-in with a TOTP code or recovery code'
      description: 'Requires a session in state `mfa_required`. Issues a new session identifier.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpLoginRequest' }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionState' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 'Revoke the current session'
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: 'Current account, credentials and CSRF token'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSession' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/reauth:
    post:
      operationId: reauthenticate
      tags: [auth]
      summary: 'Refresh recent-authentication status with password or TOTP'
      description: 'Sensitive operations (credential changes) return `reauth_required` unless the session authenticated within the last 10 minutes.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReauthRequest' }
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: 'List active sessions'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: 'Revoke one of the caller''s sessions'
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [auth]
      summary: 'Revoke all sessions except the current one'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokedCount' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/password:
    put:
      operationId: setPassword
      tags: [auth]
      summary: 'Change or add the password'
      description: 'Changing requires the current password. Other sessions are revoked.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removePassword
      tags: [auth]
      summary: 'Remove the password'
      description: 'Refused with `last_credential` if it is the only sign-in method.'
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/recovery/request:
    post:
      operationId: requestRecovery
      tags: [auth]
      summary: 'Email a recovery code'
      security: []
      description: 'Returns 501 `email_not_configured` when the instance has no SMTP; use operator recovery.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryRequest' }
      responses:
        '202':
          description: Accepted whether or not the account exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/recovery/complete:
    post:
      operationId: completeRecovery
      tags: [auth]
      summary: 'Set a new password with a recovery code'
      security: []
      description: 'Revokes every session of the account.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryComplete' }
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/totp:
    post:
      operationId: beginTotp
      tags: [auth]
      summary: 'Start TOTP enrolment'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrolment' }
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeTotp
      tags: [auth]
      summary: 'Remove the authenticator and its recovery codes'
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [auth]
      summary: 'Confirm TOTP enrolment and receive recovery codes'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpConfirm' }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/passkeys/register/options:
    post:
      operationId: passkeyRegisterOptions
      tags: [auth]
      summary: 'WebAuthn creation options (PublicKeyCredentialCreationOptionsJSON)'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/passkeys/register/verify:
    post:
      operationId: passkeyRegisterVerify
      tags: [auth]
      summary: 'Verify a created passkey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyRegisterVerify' }
      responses:
        '201':
          description: Passkey registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdOnly' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    delete:
      operationId: removePasskey
      tags: [auth]
      summary: 'Remove a passkey'
      description: 'Refused with `last_credential` if it is the only sign-in method.'
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/passkeys/login/options:
    post:
      operationId: passkeyLoginOptions
      tags: [auth]
      summary: 'WebAuthn request options for sign-in'
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/passkeys/login/verify:
    post:
      operationId: passkeyLoginVerify
      tags: [auth]
      summary: 'Sign in with a passkey'
      security: []
      description: 'Passkeys require user verification, so this is a complete sign-in.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyLoginVerify' }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionState' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/oidc/start:
    post:
      operationId: oidcStart
      tags: [auth]
      summary: 'Begin OIDC sign-in or linking'
      security: [ {}, { session: [] } ]
      description: 'Sets a short-lived `dl_oidc` browser-binding cookie. `mode: link` needs a recently authenticated session.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OidcStart' }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcStartResult' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/oidc/callback:
    parameters:
      - { name: state, in: query, schema: { type: string } }
      - { name: code, in: query, schema: { type: string } }
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: 'OIDC redirect target'
      security: [ {}, { session: [] } ]
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcCallbackResult' }
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/oidc/identities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    delete:
      operationId: unlinkOidc
      tags: [auth]
      summary: 'Unlink an OIDC identity'
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Problem'
  # --- vehicles and ownership (milestone 1.3) ---
  /v1/vehicles:
    get:
      operationId: listVehicles
      summary: Vehicles the caller is a member of
      tags: [vehicles]
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Vehicles with the caller's role on each.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Vehicle' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createVehicle
      summary: Create a vehicle; the caller becomes its owner
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getVehicle
      summary: Read a vehicle (any member). Non-members receive 404.
      tags: [vehicles]
      responses:
        '200':
          description: The vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateVehicle
      summary: Edit vehicle details (owner or editor)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiclePatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/archive:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    put:
      operationId: setVehicleArchived
      summary: Archive or unarchive a vehicle (owner only)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              additionalProperties: false
              properties:
                archived: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/members:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: listVehicleMembers
      summary: Members and roles (any member)
      tags: [vehicles]
      responses:
        '200':
          description: Roster.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VehicleMember' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addVehicleMember
      summary: Grant an active user access (owner only)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              description: Name the user by `userId` or by `email` (one is required).
              properties:
                userId: { $ref: '#/components/schemas/Id' }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/GrantableRole' }
      responses:
        '201':
          description: Granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleMember' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/members/{userId}:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
        - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    put:
      operationId: changeVehicleMemberRole
      summary: Change a non-owner member's role (owner only)
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/GrantableRole' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleMember' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeVehicleMember
      summary: Remove a member (owner), or leave (any non-owner member removing themselves)
      tags: [vehicles]
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/owner:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    put:
      operationId: transferVehicleOwnership
      summary: Transfer ownership to an existing member (owner only); the previous owner becomes an editor
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              additionalProperties: false
              properties:
                userId: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Transferred.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/vehicles/{vehicleId}/owner:
    parameters:
        - { $ref: '#/components/parameters/VehicleId' }
    put:
      operationId: recoverVehicleOwnership
      summary: Instance-admin recovery of ownership. Audited; grants no access to vehicle data.
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, reason]
              additionalProperties: false
              properties:
                userId: { $ref: '#/components/schemas/Id' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '204': { description: Ownership recovered. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/admin/users/{userId}/owned-vehicles:
    parameters:
      - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: listOwnedVehicleIds
      summary: Instance-admin list of the vehicles a user owns. Ids and archive state only; audited.
      tags: [vehicles]
      responses:
        '200':
          description: Owned vehicle ids.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, archived]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        archived: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  # --- fuel, units and costs (milestone 1.4) ---
  /v1/preferences:
    get:
      operationId: getPreferences
      summary: The caller's display preferences
      tags: [preferences]
      responses:
        '200':
          description: Preferences (defaults when never set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setPreferences
      summary: Change display preferences; stored records are never converted
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesPatch' }
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/fill-ups:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: listFillUps
      summary: Fuel purchases, newest first, with the interval each full fill closes
      tags: [fuel]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Fill-ups in the viewer's display units; entered values are returned unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FillUp' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createFillUp
      summary: Record a purchase (editor or owner)
      description: >
        Units are chosen explicitly. The odometer may not run backwards in time
        (`odometer_out_of_sequence`), the same instant and reading is a
        duplicate (`duplicate_fill_up`), and a purchase in another currency
        needs `exchangeRate` or `reportingAmount` (`reporting_amount_required`).
      tags: [fuel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FillUpInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FillUp' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/fill-ups/{fillUpId}:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
      - { name: fillUpId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: getFillUp
      summary: One purchase
      tags: [fuel]
      responses:
        '200':
          description: The fill-up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FillUp' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateFillUp
      summary: Correct a purchase; the merged record is validated again as a whole
      tags: [fuel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FillUpPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FillUp' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteFillUp
      summary: Delete a purchase
      tags: [fuel]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/stats:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getVehicleStats
      summary: Aggregate economy and spending for a window
      description: Intervals belong to the window their closing fill falls in. Economy is computed from summed distance and volume.
      tags: [fuel]
      parameters:
        - { name: from, in: query, description: Inclusive start, schema: { $ref: '#/components/schemas/Timestamp' } }
        - { name: to, in: query, description: Exclusive end, schema: { $ref: '#/components/schemas/Timestamp' } }
      responses:
        '200':
          description: Statistics in the viewer's units and the vehicle's reporting currency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleStats' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: dl_session
      description: >
        HttpOnly, SameSite=Lax session cookie issued by sign-in. A session in
        state `mfa_required` is accepted only by `/v1/auth/mfa/totp`.
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
  responses:
    Problem:
      description: 'Error in RFC 9457 problem details form.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id:
      type: string
      format: uuid
      description: 'Opaque UUIDv7 identifier generated by the server.'
      examples: ['018f3b1e-7c4a-7d2e-9a10-5b6c7d8e9f01']
    Timestamp:
      type: string
      format: date-time
      description: 'UTC instant in RFC 3339 form.'
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: >
        Exact decimal as a string. Never a JSON number. Scale rules per field
        are in docs/CONTRACTS.md.
      examples: ['42.375']
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: 'ISO 4217 alphabetic code.'
    DistanceUnit:
      type: string
      enum: [km, mi]
    VolumeUnit:
      type: string
      enum: [l, gal_us, gal_imp]
    Role:
      type: string
      enum: [owner, editor, viewer]
    GrantableRole:
      type: string
      enum: [editor, viewer]
    VehicleInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        make: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        model: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        year: { type: [integer, 'null'], minimum: 1886 }
        odometerUnit: { $ref: '#/components/schemas/DistanceUnit', description: Unit of the physical odometer. Defaults to the creator's distance preference. }
        currency: { $ref: '#/components/schemas/CurrencyCode', description: Reporting currency. Defaults to the creator's currency preference; locked once costs are recorded. }
    VehiclePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        make: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        model: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        year: { type: [integer, 'null'], minimum: 1886 }
        odometerUnit: { $ref: '#/components/schemas/DistanceUnit', description: Unit of the physical odometer. Defaults to the creator's distance preference. }
        currency: { $ref: '#/components/schemas/CurrencyCode', description: Reporting currency. Defaults to the creator's currency preference; locked once costs are recorded. }
    Vehicle:
      type: object
      required: [id, name, make, model, year, archived, odometerUnit, currency, role, createdAt, updatedAt]
      properties:
        odometerUnit: { $ref: '#/components/schemas/DistanceUnit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        make: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        archived: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    VehicleMember:
      type: object
      required: [userId, role, grantedBy, createdAt]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/Role' }
        grantedBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        displayName: { type: string }
        email: { type: string, format: email }
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 256 }
        display_name: { type: string, maxLength: 80 }
        setup_token: { type: string, maxLength: 256, description: 'Required for the first account when the operator set DRIVELOOM_SETUP_TOKEN.' }
    RegisterResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [created, verification_sent] }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }
    SessionState:
      type: object
      required: [state, csrf_token]
      properties:
        state: { type: string, enum: [signed_in, mfa_required] }
        csrf_token: { type: string, description: Send as X-CSRF-Token on unsafe requests. }
    TotpLoginRequest:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        recovery_code: { type: string }
    ReauthRequest:
      type: object
      additionalProperties: false
      properties:
        password: { type: string }
        code: { type: string }
    AccountSession:
      type: object
      required: [csrf_token, session_id, account]
      properties:
        csrf_token: { type: string }
        session_id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/Account' }
    Account:
      type: object
      required: [id, email, instanceRole, emailVerified, credentials]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string }
        displayName: { type: string }
        instanceRole: { type: string, enum: [admin, user] }
        emailVerified: { type: boolean }
        credentials: { type: object, description: Which sign-in methods are set up (password, totp, passkeys, oidc). }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
            required: [id, created_at, last_seen_at, current]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              created_at: { $ref: '#/components/schemas/Timestamp' }
              last_seen_at: { $ref: '#/components/schemas/Timestamp' }
              user_agent: { type: string }
              current: { type: boolean }
    RevokedCount:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer }
    SetPasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, description: Required when a password already exists. }
        new_password: { type: string, minLength: 12, maxLength: 256 }
    RecoveryRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
    RecoveryComplete:
      type: object
      required: [email, code, new_password]
      additionalProperties: false
      properties:
        email: { type: string }
        code: { type: string }
        new_password: { type: string, minLength: 12, maxLength: 256 }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    TotpEnrolment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret, shown once. }
        otpauth_uri: { type: string }
    TotpConfirm:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, items: { type: string }, description: Single-use codes, shown once. }
    WebAuthnOptions:
      type: object
      description: 'JSON options as defined by the WebAuthn Level 3 JSON serialisation.'
    PasskeyRegisterVerify:
      type: object
      required: [response]
      properties:
        response: { type: object, description: RegistrationResponseJSON from the browser. }
        label: { type: string, maxLength: 60 }
    PasskeyLoginVerify:
      type: object
      required: [response]
      properties:
        response: { type: object, description: AuthenticationResponseJSON from the browser. }
    IdOnly:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Id' }
    OidcStart:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [login, link], default: login }
    OidcStartResult:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    OidcCallbackResult:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [signed_in, mfa_required] }
        csrf_token: { type: string }
        status: { type: string, enum: [linked] }
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }
    VersionInfo:
      type: object
      required: [server, api, schema]
      properties:
        server: { type: string, description: Server release version. }
        api: { type: string, description: API contract version (info.version). }
        schema: { type: integer, description: Latest applied database migration. }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: Stable error identifier URI or `about:blank`. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Machine-readable error code. }
    EconomyUnit:
      type: string
      enum: [l_per_100km, km_per_l, mpg_us, mpg_imp]
      description: '`mpg_us` uses the US gallon, `mpg_imp` the imperial gallon.'
    Preferences:
      type: object
      required: [distanceUnit, volumeUnit, economyUnit, currency]
      properties:
        distanceUnit: { $ref: '#/components/schemas/DistanceUnit' }
        volumeUnit: { $ref: '#/components/schemas/VolumeUnit' }
        economyUnit: { $ref: '#/components/schemas/EconomyUnit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    PreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        distanceUnit: { $ref: '#/components/schemas/DistanceUnit' }
        volumeUnit: { $ref: '#/components/schemas/VolumeUnit' }
        economyUnit: { $ref: '#/components/schemas/EconomyUnit' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    Distance:
      type: object
      required: [value, unit]
      additionalProperties: false
      properties:
        value: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/DistanceUnit' }
    Volume:
      type: object
      required: [value, unit]
      additionalProperties: false
      properties:
        value: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/VolumeUnit' }
    Economy:
      type: object
      required: [value, unit]
      properties:
        value: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/EconomyUnit' }
    FillUpCostInput:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        exchangeRate: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: Reporting-currency units per one unit of `currency`. Only for a purchase in another currency. }
        reportingAmount: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }], description: The amount in the vehicle's reporting currency. Wins over `exchangeRate` when both are sent. }
        reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
    FillUpCost:
      type: object
      required: [amount, currency, exchangeRate, reportingAmount, reportingCurrency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        exchangeRate: { oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }] }
        reportingAmount: { $ref: '#/components/schemas/Decimal' }
        reportingCurrency: { $ref: '#/components/schemas/CurrencyCode' }
    FillUpInput:
      type: object
      required: [occurredAt, odometer, volume]
      additionalProperties: false
      properties:
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        odometer: { $ref: '#/components/schemas/Distance' }
        volume: { $ref: '#/components/schemas/Volume' }
        full: { type: boolean, default: true, description: The tank was filled completely. }
        missedPrevious: { type: boolean, default: false, description: One or more purchases before this one were not recorded. }
        cost: { oneOf: [{ $ref: '#/components/schemas/FillUpCostInput' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 500 }
    FillUpPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        odometer: { $ref: '#/components/schemas/Distance' }
        volume: { $ref: '#/components/schemas/Volume' }
        full: { type: boolean }
        missedPrevious: { type: boolean }
        cost: { oneOf: [{ $ref: '#/components/schemas/FillUpCostInput' }, { type: 'null' }] }
        notes: { type: [string, 'null'], maxLength: 500 }
    FillUpInterval:
      type: object
      required: [available, reason, distance, volume, economy]
      description: The full-to-full interval a purchase closes. Unavailable intervals carry a reason and no figures.
      properties:
        available: { type: boolean }
        reason: { type: [string, 'null'], enum: [partial_fill, no_previous_full_fill, missed_fill, no_distance, null] }
        distance: { oneOf: [{ $ref: '#/components/schemas/Distance' }, { type: 'null' }] }
        volume: { oneOf: [{ $ref: '#/components/schemas/Volume' }, { type: 'null' }] }
        economy: { oneOf: [{ $ref: '#/components/schemas/Economy' }, { type: 'null' }] }
    FillUp:
      type: object
      required: [id, vehicleId, occurredAt, odometer, volume, full, missedPrevious, cost, notes, createdBy, createdAt, updatedAt, display, interval]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        vehicleId: { $ref: '#/components/schemas/Id' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        odometer: { $ref: '#/components/schemas/Distance', description: Exactly as entered. }
        volume: { $ref: '#/components/schemas/Volume', description: Exactly as entered. }
        full: { type: boolean }
        missedPrevious: { type: boolean }
        cost: { oneOf: [{ $ref: '#/components/schemas/FillUpCost' }, { type: 'null' }] }
        notes: { type: string }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        display:
          type: object
          required: [odometer, volume]
          description: Converted values. Odometer in the vehicle's odometer unit, volume in the viewer's volume unit.
          properties:
            odometer: { $ref: '#/components/schemas/Distance' }
            volume: { $ref: '#/components/schemas/Volume' }
        interval: { oneOf: [{ $ref: '#/components/schemas/FillUpInterval' }, { type: 'null' }] }
    VehicleStats:
      type: object
      required: [vehicleId, window, fillCount, intervalCount, unavailableIntervalCount, distance, volume, economy, spend, costPerDistance, series]
      properties:
        vehicleId: { $ref: '#/components/schemas/Id' }
        window:
          type: object
          required: [from, to]
          properties:
            from: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
            to: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        fillCount: { type: integer }
        intervalCount: { type: integer, description: Available intervals in the window. }
        unavailableIntervalCount: { type: integer }
        distance: { $ref: '#/components/schemas/Distance' }
        volume: { $ref: '#/components/schemas/Volume' }
        economy: { oneOf: [{ $ref: '#/components/schemas/Economy' }, { type: 'null' }] }
        spend:
          type: object
          required: [amount, currency, costedFillCount]
          description: Sum of every costed purchase in the window, in the reporting currency. Not an efficiency figure.
          properties:
            amount: { $ref: '#/components/schemas/Decimal' }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            costedFillCount: { type: integer }
        costPerDistance:
          oneOf:
            - type: object
              required: [value, currency, per]
              properties:
                value: { $ref: '#/components/schemas/Decimal' }
                currency: { $ref: '#/components/schemas/CurrencyCode' }
                per: { $ref: '#/components/schemas/DistanceUnit' }
            - type: 'null'
        series:
          type: array
          description: Economy of each available interval, oldest first, for charts.
          items:
            type: object
            required: [at, economy]
            properties:
              at: { $ref: '#/components/schemas/Timestamp' }
              economy: { $ref: '#/components/schemas/Decimal' }
