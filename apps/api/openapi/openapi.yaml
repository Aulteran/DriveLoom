      responses:
        '204': { description: Accepted. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeFriend
      summary: Decline, cancel or unfriend; comparison access ends immediately
      tags: [friends]
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/comparison:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getComparisonOptIn
      summary: Whether this vehicle is shared for comparison with the owner's friends
      tags: [friends]
      responses:
        '200':
          description: Opt-in state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonOptIn' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setComparisonOptIn
      summary: Opt a vehicle in or out (owner only). Off by default; opting out revokes immediately
      tags: [friends]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComparisonOptIn' }
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonOptIn' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/maintenance-catalog:
    get:
      operationId: getMaintenanceCatalog
      summary: Common service types (names only) and the illustrative reminder defaults
      description: >
        Names only: DriveLoom ships no manufacturer intervals. Answers 404 `module_disabled` while the
        Service module is off. `defaults` are illustrative lead times used to mark a task "due soon";
        they are not manufacturer or safety guidance. `leadDistance` is in the caller's distance unit.
      tags: [service]
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items, defaults]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, name]
                      properties:
                        key: { type: string }
                        name: { type: string }
                  defaults: { $ref: '#/components/schemas/MaintenanceDefaults' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/maintenance-status:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getMaintenanceStatus
      summary: Counts of maintenance tasks by status, for the Service page header
      description: >
        Archived tasks are not counted. `reading` is the latest known odometer: the most recent
        reading by date among fuel records and service visits that recorded an odometer. `stale` is
        true when it is older than `defaults.staleReadingDays`. Counts reflect the caller's own
        snoozes plus vehicle-wide ones.
      tags: [service]
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/maintenance-tasks:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: listMaintenanceTasks
      summary: Maintenance tasks with their computed status (any member)
      description: >
        Every maintenance endpoint answers 404 `module_disabled` while the Service module is off, and 404 to
        non-members. Status is computed on read from the task and the service items linked to it; see
        `MaintenanceTask`. Snoozes in the response are the caller's personal one and the vehicle-wide one.
      tags: [service]
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: The tasks, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MaintenanceTask' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMaintenanceTask
      summary: Add a maintenance task (owner or editor)
      description: >
        A repeating task (`recurring` true, the default) needs `intervalDays`, `intervalDistance`, or both;
        whichever is reached first makes it due. A one-time task has no interval and needs `firstDueOn` or
        `firstDueOdometer`. `name` may be omitted when `catalogKey` is given. At most 200 tasks per vehicle.
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceTaskInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/maintenance-tasks/{taskId}:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
      - { name: taskId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: getMaintenanceTask
      summary: One maintenance task (any member)
      tags: [service]
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMaintenanceTask
      summary: Change or archive a task (owner or editor); the merged task is validated again as a whole
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceTaskPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMaintenanceTask
      summary: Delete a task and its snoozes (owner or editor)
      description: Service items that completed the task are kept; their `taskId` becomes null.
      tags: [service]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/maintenance-tasks/{taskId}/snooze:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
      - { name: taskId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      - { name: scope, in: query, description: "`personal` (default; any member, viewers included) or `vehicle` (owner or editor only; seen by every member).", schema: { type: string, enum: [personal, vehicle], default: personal } }
    put:
      operationId: setMaintenanceSnooze
      summary: Snooze a task's reminders (replaces the snooze of that scope)
      description: >
        Snoozing only mutes reminders. It never reschedules or completes the task and never changes its
        `status`, `dueOn` or `dueOdometer`; an overdue task stays overdue. A snooze is active until its
        date has passed or the known odometer exceeds its target, whichever comes first. Give `until`,
        `untilOdometer` (an absolute target) or `additionalDistance`, alone or `until` with a distance.
        `additionalDistance` is converted once, at this call, to an absolute target using the latest known odometer
        reading and the absolute target is stored; with no known reading the answer is 422 `no_odometer_reading`.
        One snooze per task and scope (per person for `personal`).
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceSnoozeInput' }
      responses:
        '200':
          description: The task as the caller now sees it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: clearMaintenanceSnooze
      summary: Clear the snooze of the given scope (nothing to clear is not an error)
      tags: [service]
      responses:
        '200':
          description: The task as the caller now sees it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTask' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/notification-settings:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getNotificationSettings
      summary: Reminder emails for this vehicle (any member)
      description: >
        Maintenance reminder emails for tasks that are due soon or overdue, sent only through the administrator's
        SMTP settings (`smtpConfigured` says whether any is configured; nothing else about SMTP is exposed). Off until
        the owner or a manager turns them on. Recipients: the owner by default, plus managers and drivers they select;
        never viewers. A person's own opt-out always wins. One email per person and vehicle groups every task that needs
        a reminder; each due point and level is announced once, then repeated every `followUpDays` while the task stays
        due (0 = never). Snoozed tasks are left out until the snooze ends; completed tasks stop. In-app status works the
        same with or without email. `recipients` and `delivery` are only filled in for the owner and managers (null
        otherwise). 404 `module_disabled` while the Service module is off, 404 to non-members.
      tags: [service]
      responses:
        '200':
          description: Settings and the caller's own state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateNotificationSettings
      summary: Change reminder emails for this vehicle (owner or editor)
      description: >
        Partial update. `recipientUserIds` replaces the selection; each must be an active member with role editor or
        driver (the owner is always included and may be listed or not; a viewer is 422). Selecting someone never
        overrides their own opt-out. Audited. 409 `vehicle_archived` on an archived vehicle.
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettingsInput' }
      responses:
        '200':
          description: The settings as they now are.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/notification-preferences/me:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    put:
      operationId: setMyNotificationPreference
      summary: Turn the caller's own reminder emails for this vehicle on or off (any member)
      description: '`emailMe: false` opts out, which always wins over being selected, and cancels reminders already queued for the caller. Audited. 409 `vehicle_archived` on an archived vehicle.'
      tags: [service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailMe]
              additionalProperties: false
              properties:
                emailMe: { type: boolean }
      responses:
        '200':
          description: The settings as the caller now sees them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/vehicles/{vehicleId}/service-visibility:
    parameters:
      - { $ref: '#/components/parameters/VehicleId' }
    get:
      operationId: getServiceVisibility
      summary: Whether the caller shows the Service page for this vehicle
      description: 'Any member. A personal preference (default on); the instance module switch overrides it.'
      tags: [vehicles]
      responses:
        '200':
          description: Preference and effective visibility.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVisibility' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setServiceVisibility
      summary: Show or hide the Service page for this vehicle (personal; any member)
      description: 'Affects only the caller''s menus. Works whether or not the instance module is enabled, and never changes permissions or deletes data.'
      tags: [vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showService]
              additionalProperties: false
              properties:
                showService: { type: boolean }
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVisibility' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/comparisons:
    get:
      operationId: compareWithFriends
      summary: Aggregate economy of the caller's vehicles and friends' opted-in vehicles over one window
      description: >
        Friends' vehicles carry a description and aggregates only: no ids,
        records, dates, distances, volumes or counts. Values are in the
        caller's units. Cost per distance appears only when the vehicle's
        reporting currency equals the caller's currency preference.
      tags: [friends]
      parameters:
        - { name: window, in: query, schema: { type: string, enum: ['30d', '90d', '365d', all], default: '90d' } }
      responses:
        '200':
          description: Comparison.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  # --- portability, images and administration (milestone 1.6) ---
  /v1/vehicles/{vehicleId}/image:
    parameters:
