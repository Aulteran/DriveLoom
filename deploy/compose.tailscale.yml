# Optional extra: also publish the app on this machine's Tailscale address.
# dev-up.cmd adds this file automatically when it finds a Tailscale IPv4 address and
# sets DRIVELOOM_TAILSCALE_IP for it. To use it by hand:
#   DRIVELOOM_TAILSCALE_IP=100.x.y.z docker compose -f deploy/compose.yml -f deploy/compose.tailscale.yml --env-file deploy/.env up -d
# Ports are added to the loopback one in compose.yml, so 127.0.0.1 keeps working.
services:
  app:
    ports:
      - '${DRIVELOOM_TAILSCALE_IP:?set DRIVELOOM_TAILSCALE_IP}:${DRIVELOOM_PORT:-8080}:8080'
