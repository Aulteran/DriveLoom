# Nginx (or Nginx Proxy Manager "Advanced" tab: use the location block only).
server {
    listen 443 ssl;
    http2 on;
    server_name fuel.example.com;
    ssl_certificate     /etc/letsencrypt/live/fuel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fuel.example.com/privkey.pem;

    # Imports and vehicle photos are the largest requests.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append: the app trusts this header only from DRIVELOOM_TRUSTED_PROXIES.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
        # API keys (Authorization: Bearer dlk_...) are passed through by default; do not clear this header.
        # They are accepted only over HTTPS: the app needs this proxy listed in DRIVELOOM_TRUSTED_PROXIES to
        # believe X-Forwarded-Proto. If you add auth_basic here, nginx consumes Authorization for itself and
        # you must strip it so a basic-auth credential never reaches the app (keys then cannot pass this
        # location; give API clients their own hostname without auth_basic):
        #   proxy_set_header Authorization "";
    }
}

server {
    listen 80;
    server_name fuel.example.com;
    return 301 https://$host$request_uri;
}
