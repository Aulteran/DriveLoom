name: api

on:
  pull_request:
    paths: ['apps/api/**', 'apps/web/**', 'deploy/**', 'Dockerfile', '.dockerignore', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', 'apps/web/**', 'deploy/**', 'Dockerfile', '.dockerignore', '.github/workflows/api.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  browser:
    # The web client in Chromium against the real application.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  deploy:
    # The real Dockerfile and compose file: build, start, wait for healthy, serve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the compose stack
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s|^DRIVELOOM_SECRET_KEY=$|DRIVELOOM_SECRET_KEY=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=$(openssl rand -hex 16)|; s|^DRIVELOOM_SETUP_TOKEN=$|DRIVELOOM_SETUP_TOKEN=$(openssl rand -hex 16)|" deploy/.env
          mkdir -p deploy/backups && sudo chown 1000:1000 deploy/backups
          docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build --wait --wait-timeout 240
      - name: Serves the API and the web client
        run: |
          curl -fsS http://127.0.0.1:8080/v1/health
          curl -fsS http://127.0.0.1:8080/v1/version
          curl -fsS http://127.0.0.1:8080/ | grep -q 'src="/js/main.js"'
      - name: Backup round trip inside the container
        run: |
          docker compose -f deploy/compose.yml --env-file deploy/.env exec -T app node scripts/backup.ts create /backups/ci.dl-backup
          docker compose -f deploy/compose.yml --env-file deploy/.env exec -T app node scripts/backup.ts verify /backups/ci.dl-backup
      - if: failure()
        run: docker compose -f deploy/compose.yml --env-file deploy/.env logs
